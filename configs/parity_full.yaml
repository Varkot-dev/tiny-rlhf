# M2 parity run, Colab T4 scale. Run through both scripts/train_dpo.py and
# scripts/train_trl.py, then compare with scripts/plot_parity.py.
# Same as dpo_full.yaml except:
#   max_steps: 100      parity needs enough steps to compare the two runs step by step, not a
#                       full epoch. 100 steps of 8 pairs keep both float32 runs inside one
#                       Colab session. The cap also shortens the lr schedule (10 warmup
#                       steps, decay to 0 at step 100) identically for both implementations.
#   eval_every: 50      held-out evaluation at steps 0, 50 and 100
#   shuffle: false      both implementations see the pairs in dataset order
#   lora_dropout: 0.0   no random numbers during training
#   n_train: 3997       with seed 0 and max_length 512, 3696 pairs survive the
#                       over-long-prompt drop: exactly 462 optimizer steps of 8 pairs, so no
#                       short micro-batch (the one place the two loops weight differently)
#   n_eval: 500         456 pairs survive: 228 equal held-out batches of 2
#   amp: false          float32, not fp16. Under fp16 a GradScaler overflow is handled
#                       differently by the two loops: ours redoes the same pairs, the
#                       Trainer drops the batch, counts the step and leaves the scheduler
#                       where it was. After one such event the runs see different data
#                       and exact parity is over. Float32 has no scaler, so it cannot
#                       happen. The cost is speed and memory: activations and logits
#                       are twice the size. With 1 pair per micro-batch (2 sequences of
#                       512 tokens) this should fit a 15 GB T4, but that is an estimate:
#                       the only measurement so far is 13.5 GB for 2 pairs in fp16 before
#                       the scoring rewrite. If it runs out of memory, use
#                       --set amp=true and read parity_summary.json's
#                       exact_parity_expected field before trusting step-by-step equality.
run_name: parity_full
model_name: Qwen/Qwen2.5-0.5B-Instruct
dataset_name: trl-lib/ultrafeedback_binarized
n_train: 3997
n_eval: 500
max_length: 512
beta: 0.1
lr: 5.0e-5
weight_decay: 0.0
warmup_ratio: 0.1
epochs: 1
batch_size: 1
grad_accum: 8
max_grad_norm: 1.0
eval_every: 50
eval_batch_size: 2
seed: 0
shuffle: false
use_lora: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.0
lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
amp: false
device: auto
max_steps: 100
save_adapter: false
