# Track B smoke test: the whole train-and-evaluate pipeline on a CPU.
# Results from this config show that the code runs. They are not a finding.
#
# lr 2.0e-4: twice the Track A tiny config. The run has about 50 optimizer steps and
# Track B responses are short (a median of 9 words), so each pair carries far fewer
# response tokens than an UltraFeedback pair and a smaller gradient signal. This value
# is a starting guess that has not been tuned.
run_name: trackb_tiny
model_name: HuggingFaceTB/SmolLM2-135M-Instruct
dataset_name: data/trackb          # a directory: train.jsonl and val.jsonl are read from it
n_train: 200
n_eval: 48
max_length: 320                    # the longest Track B example is 305 tokens: nothing is cut
beta: 0.1
lr: 2.0e-4
weight_decay: 0.0
warmup_ratio: 0.1
epochs: 1
batch_size: 4
grad_accum: 1
max_grad_norm: 1.0
eval_every: 10
eval_batch_size: 8
seed: 0
shuffle: true
use_lora: true
lora_r: 8
lora_alpha: 16
lora_dropout: 0.0
lora_target_modules: [q_proj, v_proj]
amp: auto
device: auto
max_steps: null
save_adapter: true
