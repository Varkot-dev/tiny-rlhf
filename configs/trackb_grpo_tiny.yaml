# GRPO smoke test on a CPU: SmolLM2-135M, 2 prompts x 4 answers per step, short answers.
# Checks that sampling, the checker reward, the update, the logs and the adapter all work
# end to end; the numbers are not a result.
run_name: trackb_grpo_tiny
model_name: HuggingFaceTB/SmolLM2-135M-Instruct
dataset_name: data/trackb
n_train: 100
max_length: 320
seed: 0
num_generations: 4
per_device_train_batch_size: 4
gradient_accumulation_steps: 2
steps_per_generation: null
max_completion_length: 32
temperature: 1.0
top_p: 1.0
top_k: 0
beta: 0.04
epsilon: 0.2
loss_type: dapo
scale_rewards: group
lr: 2.0e-4
lr_scheduler: linear
warmup_ratio: 0.0
weight_decay: 0.0
max_grad_norm: 1.0
max_steps: 2
max_minutes: null
gradient_checkpointing: false
lora_r: 8
lora_alpha: 16
lora_dropout: 0.0
lora_target_modules: [q_proj, v_proj]
reward_correct: 1.0
reward_violation: -1.0
reward_echoed: -0.5
reward_truncated: -0.25
sample_every: 1
amp: auto
device: auto
save_adapter: true
