# beta sweep: how far the policy may drift from the reference vs how well it ranks pairs.
#
# beta multiplies the log-ratio difference inside the sigmoid. A small beta makes each
# pair push gently for a long time (weak pull back to the reference); a large beta pushes
# hard and stops as soon as a pair is ranked correctly.
#
# Values: the three in docs/PLAN.md section 4. 0.03 and 0.3 would fill in the curve and
# are left commented out: each value is one more full training run plus one drift
# evaluation, and no Qwen run has been timed yet. Uncomment them once a run's
# wall_time_s is known and the extra time is acceptable.
#
# Budget: reduced from dpo_full (4000 / 500 pairs) to keep three runs affordable on a
# free T4. Everything else is dpo_full.yaml.
#
# After the runs, each needs its drift measured (the x axis of the figure):
#   python scripts/eval_drift.py --run results/sweep_beta_<label>
# then: python scripts/plot_beta_sweep.py
name: beta
description: beta in {0.01, 0.1, 0.5}; drift from the reference against preference accuracy
base_config: configs/dpo_full.yaml
field: beta
run_name: "sweep_beta_{label}"
x_label: beta
x_scale: log
overrides:
  n_train: 2000
  n_eval: 300
  eval_every: 50
values:
  - 0.01
  # - 0.03
  - 0.1
  # - 0.3
  - 0.5
